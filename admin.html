<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow"><title>Admin · DCU Blood Directory</title>
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',system-ui,sans-serif}body{margin:0;background:#f3f5f8;color:#222}
.wrap{max-width:900px;margin:0 auto;padding:18px}h2{color:#b3261e;margin:0 0 12px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.07);margin-bottom:12px}
button{border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;background:#b3261e;color:#fff;font-weight:600}
button.g{background:#1b873f}button.o{background:#fff;color:#333;border:1px solid #ccd}button.d{background:#fff;color:#b3261e;border:1px solid #e0b4b0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.st{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.st div{background:#fff;border-radius:10px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}.st b{display:block;font-size:22px;color:#b3261e}
.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.tabs button{background:#fff;color:#333;border:1px solid #ccd}.tabs button.on{background:#b3261e;color:#fff;border-color:#b3261e}
input{width:100%;padding:10px;border:1.5px solid #ccd;border-radius:8px;font-size:14px;margin:6px 0 10px}
.dn{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.dn img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#eee}.dn .i{flex:1;min-width:200px}
.badge{background:#b3261e;color:#fff;border-radius:6px;padding:1px 8px;font-size:12px}.m{font-size:13px;color:#555}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #eee;padding:7px;text-align:left}
@media(max-width:560px){.st{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div class="wrap">
<h2>🔐 DCU ব্লাড ডিরেক্টরি, এডমিন</h2>
<div id="gate" class="card"><p>এই পেজটি শুধু অনুমোদিত এডমিনের জন্য। চালিয়ে যেতে সাইন ইন করুন।</p><button id="login">Google দিয়ে সাইন ইন</button><p id="gmsg" class="m"></p></div>
<div id="app" style="display:none">
 <div class="card bar"><span>সাইন ইন: <b id="who"></b></span><span><button class="o" id="ref">🔄 রিফ্রেশ</button> <button class="o" id="csv">⬇️ CSV</button> <button class="d" id="out">সাইন আউট</button></span></div>
 <div class="st" id="stats"></div>
 <div class="tabs" id="tabs"><button data-t="pending" class="on">⏳ অনুমোদনের অপেক্ষায়</button><button data-t="approved">✅ অনুমোদিত</button><button data-t="logs">📞 নম্বর দেখার লগ</button></div>
 <input id="q" placeholder="নাম, নম্বর, এলাকা বা গ্রুপ দিয়ে খুঁজুন...">
 <div id="list"></div>
</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, getDocs, query, orderBy, limit, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const ADMIN_EMAIL = "ojanaraja3@gmail.com";
const app = initializeApp({ apiKey:"AIzaSyBgaBKzAAwzHI7ahGKqzbrX9MknWWIm9j0", authDomain:"dcu-blood-bank.firebaseapp.com", projectId:"dcu-blood-bank", storageBucket:"dcu-blood-bank.firebasestorage.app", messagingSenderId:"835221249900", appId:"1:835221249900:web:facf545941825a4efa5d49" });
const auth = getAuth(app), db = getFirestore(app), $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AV = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56"><rect width="56" height="56" rx="28" fill="#eee"/><circle cx="28" cy="21" r="9" fill="#bbb"/><path d="M9 50c3-13 35-13 38 0z" fill="#bbb"/></svg>');
const ms = d => d && d.toMillis ? d.toMillis() : 0, fd = d => ms(d) ? new Date(ms(d)).toLocaleString("bn-BD") : "-";
let D = [], LG = [], tab = "pending";

$("login").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => $("gmsg").textContent = "সাইন ইন সম্ভব হয়নি: " + e.code);
$("out").onclick = () => signOut(auth);
onAuthStateChanged(auth, u => {
  if (!u) { $("gate").style.display = "block"; $("app").style.display = "none"; return; }
  if (u.email !== ADMIN_EMAIL || !u.emailVerified) { $("gmsg").textContent = "এই অ্যাকাউন্টের (" + u.email + ") প্রবেশাধিকার নেই।"; signOut(auth); return; }
  $("gate").style.display = "none"; $("app").style.display = "block"; $("who").textContent = u.email; load();
});
async function load() {
  $("list").textContent = "লোড হচ্ছে...";
  try {
    D = (await getDocs(collection(db, "donors"))).docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
    try { LG = (await getDocs(query(collection(db, "activity_logs"), orderBy("timestamp", "desc"), limit(300)))).docs.map(x => ({ id: x.id, ...x.data() })); } catch (e) { LG = []; }
    render();
  } catch (e) { $("list").textContent = "ডেটা লোড হয়নি: " + (e.code || e.message) + " (Firestore Rules ও এডমিন ইমেইল দেখুন)"; }
}
function render() {
  const pend = D.filter(d => d.status !== "approved").length;
  $("stats").innerHTML = [["মোট ডোনার", D.length], ["অপেক্ষায়", pend], ["অনুমোদিত", D.length - pend], ["নম্বর দেখা", LG.length]].map(([a, b]) => `<div><b>${b}</b>${a}</div>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  const q = $("q").value.trim().toLowerCase(), has = o => Object.values(o).some(v => typeof v === "string" && v.length < 300 && v.toLowerCase().includes(q));
  if (tab === "logs") {
    const L = LG.filter(has);
    $("list").innerHTML = L.length ? `<div class="card" style="overflow-x:auto"><table><tr><th>সময়</th><th>ডোনার</th><th>অনুসন্ধানকারী</th><th>মোবাইল</th><th>ঠিকানা</th></tr>${L.map(l => `<tr><td>${fd(l.timestamp)}</td><td>${esc(l.donorName)}<br><span class="m">${esc(l.donorPhone)}</span></td><td>${esc(l.seekerName)}</td><td>${esc(l.seekerPhone)}</td><td>${esc(l.seekerAddress)}</td></tr>`).join("")}</table></div>` : '<p class="m">কোনো লগ নেই।</p>';
    return;
  }
  const L = D.filter(d => (tab === "approved") === (d.status === "approved")).filter(has);
  $("list").innerHTML = L.length ? L.map(d => `<div class="card dn"><img src="${typeof d.photo === "string" && (d.photo.startsWith("data:image/") || d.photo.startsWith("https://firebasestorage.googleapis.com/")) ? esc(d.photo) : AV}" alt=""><div class="i"><b>${esc(d.name)}</b> <span class="badge">${esc(d.group)}</span><div class="m">📍 ${esc(d.address)} | 📞 ${esc(d.phone)} | 🩸 ${esc(d.donationCount)} বার</div><div class="m">নিবন্ধন: ${fd(d.createdAt)}</div></div><div>${d.status === "approved" ? `<button class="o" data-a="pend" data-id="${esc(d.id)}">অনুমোদন প্রত্যাহার</button>` : `<button class="g" data-a="ok" data-id="${esc(d.id)}">✅ অনুমোদন</button>`} <button class="d" data-a="del" data-id="${esc(d.id)}">🗑️ মুছুন</button></div></div>`).join("") : '<p class="m">এই তালিকায় কিছু নেই।</p>';
}
$("tabs").onclick = e => { if (e.target.dataset.t) { tab = e.target.dataset.t; render(); } };
$("q").oninput = render; $("ref").onclick = load;
$("list").onclick = async e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const id = b.dataset.id, d = D.find(x => x.id === id); if (!d) return;
  try {
    if (b.dataset.a === "del") { if (!confirm(`"${d.name}"-কে স্থায়ীভাবে মুছে ফেলবেন?`)) return; await deleteDoc(doc(db, "donors", id)); D = D.filter(x => x.id !== id); }
    else { const st = b.dataset.a === "ok" ? "approved" : "pending"; await updateDoc(doc(db, "donors", id), { status: st }); d.status = st; }
    render();
  } catch (err) { alert("কাজটি সম্পন্ন হয়নি: " + (err.code || err.message)); }
};
$("csv").onclick = () => {
  const c = v => '"' + String(v ?? "").replace(/"/g, '""') + '"', rows = [["Name","Group","Address","Phone","Donations","Status","Registered"]].concat(D.map(d => [d.name, d.group, d.address, d.phone, d.donationCount, d.status, ms(d.createdAt) ? new Date(ms(d.createdAt)).toISOString() : ""]));
  const a = document.createElement("a"); a.download = "donors.csv"; a.href = URL.createObjectURL(new Blob(["\ufeff" + rows.map(r => r.map(c).join(",")).join("\n")], { type: "text/csv" })); a.click();
};
</script>
</body></html>
