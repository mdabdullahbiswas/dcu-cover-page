<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0a2240">
<title>Admin · DCU Blood Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<script>
/* থিম: ফ্ল্যাশ ছাড়া আগেই বসানো */
(function(){var t=null;try{t=localStorage.getItem('adminTheme')}catch(e){}
if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.dataset.theme=t;})();
</script>
<style>
:root{
  --bg:#f3f6fb;--surface:#ffffff;--surface2:#f7f9fd;--ink:#0e1a2e;--mu:#64748b;--ln:#e4e9f2;
  --navy:#0a2240;--navy2:#14386a;--gold:#e5a83b;--gold2:#f6d68f;
  --red:#d92d20;--red2:#b3261e;--redSoft:#fee4e2;--green:#12a150;--greenSoft:#dcfae6;--amberSoft:#fef0c7;--amber:#b54708;--blue:#1d9bf0;
  --shadow:0 1px 2px rgba(14,26,46,.05),0 8px 24px rgba(14,26,46,.06);--shadowLg:0 24px 60px rgba(14,26,46,.18);
  --r:18px;
  --f:'Plus Jakarta Sans','Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fh:'Playfair Display','Noto Serif Bengali','Hind Siliguri',serif;
}
html[data-theme=dark]{
  --bg:#08101e;--surface:#101b2f;--surface2:#142339;--ink:#e8eef9;--mu:#94a5bf;--ln:#213352;
  --redSoft:#3a1612;--greenSoft:#0d2e1d;--amberSoft:#38270a;--amber:#f5b94a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--shadowLg:0 28px 70px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
.mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.mesh i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.mesh i:nth-child(1){width:420px;height:420px;top:-140px;right:-100px;background:rgba(229,168,59,.28)}
.mesh i:nth-child(2){width:480px;height:480px;top:30%;left:-180px;background:rgba(20,56,106,.22);animation-duration:22s}
.mesh i:nth-child(3){width:340px;height:340px;bottom:-120px;right:15%;background:rgba(217,45,32,.12);animation-duration:26s}
html[data-theme=dark] .mesh i{opacity:.4}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,50px) scale(1.18)}}
.ic{width:18px;height:18px;flex:none}
/* ===== টপ বার ===== */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--ln)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;padding-top:max(10px,env(safe-area-inset-top))}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--gold2);background:linear-gradient(135deg,var(--navy),var(--navy2));box-shadow:0 6px 16px rgba(10,34,64,.35),inset 0 0 0 1px rgba(246,214,143,.35)}
.logo svg{width:22px;height:22px}
.brand b{display:block;font-family:var(--fh);font-size:17px;font-weight:700;letter-spacing:.2px;line-height:1.2}
.brand span{display:block;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}
.sp{flex:1}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:22px 18px 80px}
/* ===== বাটন ===== */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 15px;border-radius:12px;font:600 13.5px/1 var(--f);color:var(--ink);background:var(--surface);border:1px solid var(--ln);box-shadow:0 1px 2px rgba(14,26,46,.04);transition:transform .15s,box-shadow .2s,background .2s,border-color .2s,opacity .2s;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(14,26,46,.1);border-color:color-mix(in srgb,var(--ink) 18%,var(--ln))}
.btn:active{transform:none}
.btn:focus-visible,.tab:focus-visible,.search input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.icon{width:40px;padding:0}
.btn.ok{color:#fff;border-color:transparent;background:linear-gradient(135deg,#1db262,#0f8f4a);box-shadow:0 6px 16px rgba(18,161,80,.3)}
.btn.ok:hover{box-shadow:0 10px 22px rgba(18,161,80,.4)}
.btn.dng{color:var(--red);background:var(--redSoft);border-color:transparent}
.btn.dng:hover{background:var(--red);color:#fff;box-shadow:0 8px 18px rgba(217,45,32,.3)}
.btn.pri{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--navy2),var(--navy))}
.btn.gold{color:#0a2240;border-color:transparent;background:linear-gradient(135deg,#f9dc9b,#e5a83b 60%,#d29a2e);box-shadow:0 8px 20px rgba(229,168,59,.35)}
.btn.out{color:var(--mu)}
/* ===== কার্ড ===== */
.card{background:var(--surface);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--shadow)}
/* ===== লগইন গেট ===== */
#gate{padding:min(9vh,70px) 0 20px}
.gate-card{max-width:440px;margin:0 auto;overflow:hidden;animation:up .7s cubic-bezier(.2,.8,.2,1) both;text-align:center}
.gate-hero{position:relative;padding:34px 24px 26px;color:#fff;background:linear-gradient(140deg,#07192f,#0a2240 55%,#14386a);overflow:hidden}
.gate-hero:before{content:"";position:absolute;top:-90px;right:-70px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(229,168,59,.4),transparent 68%);animation:drift 12s ease-in-out infinite alternate}
.gate-hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,#e5a83b 30%,#f6d68f 50%,#e5a83b 70%,transparent)}
.gate-ico{position:relative;width:72px;height:72px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;color:var(--gold2);background:rgba(246,214,143,.1);border:1.5px solid rgba(246,214,143,.7);box-shadow:0 0 0 9px rgba(246,214,143,.08)}
.gate-ico svg{width:34px;height:34px}
.gate-hero h1{position:relative;font-family:var(--fh);font-size:26px;font-weight:700;letter-spacing:.2px;line-height:1.3}
.gate-hero p{position:relative;margin-top:4px;font-size:11.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold2)}
.gate-body{padding:26px 26px 28px}
.gate-body>p{color:var(--mu);font-size:14px;margin-bottom:20px}
.gbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:52px;border-radius:14px;font:700 15px/1 var(--f);color:#1f2937;background:#fff;border:1px solid #dadce0;box-shadow:0 2px 6px rgba(0,0,0,.08);transition:transform .15s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.gbtn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.14)}
.gbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gbtn svg{width:22px;height:22px}
.msg{min-height:20px;margin-top:14px;font-size:13px;color:var(--red);font-weight:500}
/* ===== টুলবার ===== */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;animation:up .5s both}
.who{display:flex;align-items:center;gap:10px;min-width:0;padding:5px 14px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--ln);box-shadow:var(--shadow)}
.who i{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--f);font-style:normal;color:#0a2240;background:linear-gradient(135deg,var(--gold2),var(--gold))}
.who small{display:block;font-size:10.5px;color:var(--mu);line-height:1.1;font-weight:600}
.who b{display:block;font-size:13px;font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.tb-r{margin-left:auto;display:flex;gap:8px}
/* ===== পরিসংখ্যান ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{position:relative;overflow:hidden;padding:18px 18px 16px;animation:up .6s both}
.stat:nth-child(2){animation-delay:.06s}.stat:nth-child(3){animation-delay:.12s}.stat:nth-child(4){animation-delay:.18s}
.stat:after{content:"";position:absolute;top:-30px;right:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 70%);opacity:.16}
.stat .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#000))}
.stat .si svg{width:19px;height:19px}
.stat b{display:block;font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:3px;font-size:12.5px;font-weight:600;color:var(--mu)}
/* ===== ট্যাব ===== */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;box-sizing:border-box;cursor:pointer;flex:none;scroll-snap-align:start;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;font:600 13.5px/1 var(--f);color:var(--mu);background:var(--surface);border:1px solid var(--ln);transition:all .2s;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.tab:hover{color:var(--ink);transform:translateY(-1px)}
.tab .ic{width:16px;height:16px}
.tab em{font-style:normal;min-width:22px;height:22px;padding:0 7px;border-radius:11px;display:inline-grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--surface2);color:var(--mu);border:1px solid var(--ln)}
.tab.on{color:var(--gold2);border-color:transparent;background:linear-gradient(135deg,var(--navy2),var(--navy));box-shadow:0 8px 20px rgba(10,34,64,.3)}
.tab.on em{background:var(--gold);color:#0a2240;border-color:transparent}
/* ===== সার্চ ===== */
.search{position:relative;display:block;margin:6px 0 18px}
.search .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.search input{width:100%;height:50px;padding:0 18px 0 46px;border-radius:15px;border:1px solid var(--ln);background:var(--surface);color:var(--ink);font:500 14.5px var(--f);box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.search input::placeholder{color:var(--mu)}
.search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(229,168,59,.18)}
/* ===== ডোনার কার্ড ===== */
#list{display:grid;gap:12px}
#list.fx>*{animation:up .55s both cubic-bezier(.2,.8,.2,1)}
#list.fx>*:nth-child(2){animation-delay:.04s}#list.fx>*:nth-child(3){animation-delay:.08s}#list.fx>*:nth-child(4){animation-delay:.12s}#list.fx>*:nth-child(5){animation-delay:.16s}#list.fx>*:nth-child(n+6){animation-delay:.2s}
.dcard{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 18px;transition:transform .2s,box-shadow .25s,border-color .2s}
.dcard:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(14,26,46,.12);border-color:color-mix(in srgb,var(--gold) 45%,var(--ln))}
.av{width:66px;height:66px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#c98a1d)}
.av img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--surface2);border:2px solid var(--surface)}
.dh{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.dh h3{font-size:16.5px;font-weight:700;letter-spacing:-.1px}
.vt{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--blue);color:#fff;box-shadow:0 0 0 3px rgba(29,155,240,.18)}
.vt svg{width:11px;height:11px}
.bg{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:9px;font-size:12.5px;font-weight:800;letter-spacing:.3px;color:#fff;background:linear-gradient(135deg,#ec4a4f,#b3261e);box-shadow:0 4px 10px rgba(217,45,32,.3)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--green);background:var(--greenSoft)}.pill.warn{color:var(--amber);background:var(--amberSoft)}.pill.mu{color:var(--mu);background:var(--surface2);border:1px solid var(--ln)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--mu);background:var(--surface2);border:1px solid var(--ln);text-decoration:none}
.chip .ic{width:14px;height:14px;color:var(--gold)}
a.chip:hover{color:var(--ink);border-color:var(--gold)}
.sub{margin-top:8px;font-size:12px;color:var(--mu)}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
/* ===== টেবিল ===== */
.tbl{overflow:hidden;animation:up .5s both}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th{position:sticky;top:0;text-align:left;padding:13px 16px;font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mu);background:var(--surface2);border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--ln);vertical-align:top}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
td .m{display:block;margin-top:2px;font-size:12.5px;color:var(--mu)}
td .acts{justify-content:flex-start;flex-wrap:nowrap}
.badge{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 8px;border-radius:13px;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ec4a4f,#b3261e)}
.nm{white-space:nowrap}
/* ===== খালি/স্কেলিটন ===== */
.empty{text-align:center;padding:54px 20px;color:var(--mu);animation:up .5s both}
.empty .ic{width:46px;height:46px;margin-bottom:12px;color:var(--gold);opacity:.9}
.empty p{font-size:14.5px;font-weight:500}
.sk{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:18px;align-items:center}
.sk i{display:block;border-radius:12px;background:linear-gradient(100deg,var(--surface2) 30%,color-mix(in srgb,var(--surface2) 55%,var(--ln)) 50%,var(--surface2) 70%) 0 0/250% 100%;animation:shim 1.4s linear infinite}
.sk i:first-child{width:66px;height:66px;border-radius:50%}
.sk div i{height:14px;margin-bottom:10px}.sk div i:first-child{width:46%;height:18px;border-radius:9px}.sk div i:last-child{width:72%;margin:0}
@keyframes shim{to{background-position:-250% 0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* ===== টোস্ট ও কনফার্ম ===== */
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:14px;font-size:13.5px;font-weight:600;color:#fff;background:#0f1b2d;border:1px solid rgba(255,255,255,.1);box-shadow:var(--shadowLg);animation:toastIn .4s cubic-bezier(.2,.9,.3,1.2) both}
.toast.err{background:#7a1a12}.toast.out{animation:toastOut .3s both}
.toast .ic{color:var(--gold2)}.toast.err .ic{color:#ffb4ab}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:18px;background:rgba(3,10,22,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s both}
.dlg{width:100%;max-width:400px;padding:26px 24px 22px;text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both;box-shadow:var(--shadowLg)}
.dlg .di{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;color:var(--red);background:var(--redSoft)}
.dlg .di svg{width:26px;height:26px}
.dlg p{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:20px;word-break:break-word}
.dlg .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dlg .btn{height:46px;width:100%}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}}
/* ===== মোবাইল ===== */
@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}.dcard{grid-template-columns:auto 1fr}.acts{grid-column:1/-1;justify-content:stretch}.acts .btn{flex:1 1 auto}}
@media(max-width:640px){
  .wrap{padding:16px 14px 80px}.top-in{padding-left:14px;padding-right:14px}
  .brand b{font-size:15.5px}.stat{padding:15px 14px 13px}.stat b{font-size:26px}
  .who b{max-width:150px}.tb-r{width:100%;margin-left:0}.tb-r .btn{flex:1}
  .tb-r .btn span{display:none}.tb-r .btn{padding:0}
  .dcard{padding:14px;gap:13px}.av{width:58px;height:58px}
  th,td{padding:12px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="top"><div class="top-in">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5s6.5 6.8 6.5 11.7a6.5 6.5 0 0 1-13 0C5.5 9.3 12 2.5 12 2.5z"/></svg></div>
  <div class="brand"><b>DCU Blood Directory</b><span>Admin Console</span></div>
  <div class="sp"></div>
  <button class="btn icon" id="theme" type="button" aria-label="Theme" title="Theme"></button>
</div></header>

<div class="wrap">
  <div id="gate">
    <div class="card gate-card">
      <div class="gate-hero">
        <div class="gate-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12.5l2.2 2.2L15.5 10"/></svg></div>
        <h1>এডমিন কনসোল</h1>
        <p>DCU Blood Directory</p>
      </div>
      <div class="gate-body">
        <p>এই পেজটি শুধু অনুমোদিত এডমিনের জন্য। চালিয়ে যেতে সাইন ইন করুন।</p>
        <button id="login" class="gbtn" type="button">
